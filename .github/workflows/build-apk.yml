name: Build ZERNEX Vault (Release)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Restore release keystore when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > hugues-release.keystore
            chmod 600 hugues-release.keystore
            echo "Release keystore restored from GitHub Secret."
          elif [ -f hugues-release.keystore ]; then
            echo "Release keystore found in repository."
          else
            echo "No release keystore configured; Gradle will use debug signing for this test build."
          fi

      - name: Verify signing configuration
        env:
          KEYSTORE_PASSWORD: 'Hugues@75'
          KEY_ALIAS: 'hugues'
          KEY_PASSWORD: 'Hugues@75'
        run: |
          test -f hugues-release.keystore
          keytool -list -keystore hugues-release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null
          echo "Release keystore verified."

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: 'Hugues@75'
          KEY_ALIAS: 'hugues'
          KEY_PASSWORD: 'Hugues@75'
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: List APKs
        if: always()
        run: |
          if [ -d app/build/outputs/apk ]; then
            find app/build/outputs/apk -type f -name '*.apk' -exec ls -lh {} \;
          else
            echo "No APK output directory was created."
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: ZERNEX-Vault-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create source ZIP
        if: success()
        run: |
          zip -r "ZERNEX-Vault-source-${GITHUB_SHA::7}.zip" . \
            -x '.git/*' '.gradle/*' 'app/build/*' 'hugues-release.keystore'

      - name: Upload source ZIP
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ZERNEX-Vault-source
          path: ZERNEX-Vault-source-*.zip
          if-no-files-found: error
          retention-days: 14

name: Build ZERNEX Vault (Debug + Release)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify keystore
        run: |
          test -f hugues-release.keystore
          keytool -list -keystore hugues-release.keystore -storepass 'Hugues@75' | head -8

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          KEYSTORE_PASSWORD: Hugues@75
          KEY_ALIAS: hugues
          KEY_PASSWORD: Hugues@75

      - name: List APKs
        if: always()
        run: find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZERNEX-Vault-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZERNEX-Vault-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
